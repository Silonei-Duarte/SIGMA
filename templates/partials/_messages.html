{% if messages %}
  {% for message in messages %}
  <div class="alerta {% if message.tags == 'success' %}alerta-sucesso{% elif message.tags == 'warning' %}alerta-atencao{% elif message.tags == 'error' %}alerta-erro{% else %}alerta-info{% endif %} mb-3">
    <i data-lucide="{% if message.tags == 'success' %}circle-check{% elif message.tags == 'warning' %}triangle-alert{% elif message.tags == 'error' %}circle-x{% else %}info{% endif %}"
       class="h-5 w-5 shrink-0 {% if message.tags == 'success' %}alerta-icone-sucesso{% elif message.tags == 'warning' %}alerta-icone-atencao{% elif message.tags == 'error' %}alerta-icone-erro{% else %}alerta-icone-info{% endif %}"
       aria-hidden="true"></i>
    <span class="flex-1">{{ message }}</span>
    <button type="button" onclick="this.parentElement.remove()" class="alerta-fechar" aria-label="Fechar"><i data-lucide="x" class="h-5 w-5" aria-hidden="true"></i></button>
  </div>
  {% endfor %}
{% endif %}
