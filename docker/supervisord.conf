; supervisord do container único do SIGMA: mantém postgresql, daphne e nginx
; vivos no mesmo processo. Os workers em background do SIGMA (envia_pendencias
; e afins) NÃO entram aqui — já rodam como threads dentro do próprio processo
; Daphne (accounts/apps.py::iniciar_workers_em_background(), chamado por
; SIGMA/asgi.py na carga do módulo).
[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

; O binário direto do postgres (não o wrapper pg_ctlcluster) porque supervisord
; precisa de um comando que rode em primeiro plano; o postgres em si já é o
; processo do servidor. `config_file` aponta para o config gerado pelo
; pg_createcluster do entrypoint.sh, que já referencia o data_directory certo.
[program:postgresql]
command=/usr/lib/postgresql/18/bin/postgres -D /var/lib/postgresql/18/main -c config_file=/etc/postgresql/18/main/postgresql.conf
user=postgres
autorestart=true
priority=10
stopsignal=INT
stdout_logfile=/var/log/supervisor/postgresql.log
stderr_logfile=/var/log/supervisor/postgresql.err.log

; wait-for-postgres.sh evita a corrida em que o Daphne sobe (e tenta a
; advisory lock dos workers) antes do PostgreSQL aceitar conexões.
; user=sigma: o Daphne processa requisição de rede externa direto (view,
; formulário, WebSocket) — roda com usuário dedicado sem privilégio, não
; como root. entrypoint.sh e o supervisord em si continuam root (setup de
; sistema: criar cluster do Postgres, ajustar dono de /var/lib/postgresql),
; mas isso não é código exposto a entrada não confiável da mesma forma.
[program:daphne]
command=/usr/local/bin/wait-for-postgres.sh
directory=/opt/SIGMA
user=sigma
environment=HOME="/opt/SIGMA"
autorestart=true
priority=20
startsecs=3
stdout_logfile=/var/log/supervisor/daphne.log
stderr_logfile=/var/log/supervisor/daphne.err.log

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autorestart=true
priority=30
stdout_logfile=/var/log/supervisor/nginx.log
stderr_logfile=/var/log/supervisor/nginx.err.log
