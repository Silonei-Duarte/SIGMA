# Config mínima do Nginx dentro do container único do SIGMA — substitui por
# completo o /etc/nginx/nginx.conf padrão do pacote Ubuntu (mais simples do
# que encaixar em sites-available/sites-enabled para um único server_name).
#
# TLS fica fora de escopo desta primeira versão (ver docker/README.md): este
# Nginx escuta HTTP simples na porta 80 dentro do container. Quem expuser este
# container numa VM real decide o certificado por fora (outro Nginx no host,
# ou um proxy adicional) — não é este arquivo que replica ssl_certificate/
# ssl_certificate_key da config real de produção, que são específicos do
# domínio (docs/sigma/03-servidor-e-hospedagem.md).
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 20M;

    # Necessário para as rotas WebSocket (balança em tempo real, atualização
    # de OP): só troca a conexão para "upgrade" quando o cliente pediu.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80 default_server;
        server_name _;

        # Equivalente ao `alias /opt/SIGMA/staticfiles/` da config real de
        # produção (docs/sigma/03-servidor-e-hospedagem.md).
        location /static/ {
            alias /opt/SIGMA/staticfiles/;
        }

        location / {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
